
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Images</title>
    <link
    
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css">

  
  </head>
  <body>
    <div class="container">
      <div class="row row-cols-3">
        <div class="col-md-4">
          <img
            class="img-fluid"
            src="https://cdn.pixabay.com/photo/2022/07/04/10/46/vintage-car-7300881_1280.jpg"
            alt="bmw"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-thumbnail"
            src="https://cdn.pixabay.com/photo/2024/07/13/07/40/cars-8891625_1280.jpg"
            alt="car2"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded"
            src="https://cdn.pixabay.com/photo/2023/05/19/10/13/jeep-8004136_1280.jpg"
            alt="car 3"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded-circle"
            src="https://cdn.pixabay.com/photo/2022/06/07/16/22/drift-7248723_1280.jpg"
            alt="car 4"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded-top"
            src="https://cdn.pixabay.com/photo/2017/03/27/14/56/auto-2179220_1280.jpg"
            alt="car 5"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded-start"
            src="https://cdn.pixabay.com/photo/2013/07/13/11/27/car-158202_1280.png"
            alt="car 6"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded-pill"
            src="https://cdn.pixabay.com/photo/2020/06/22/19/30/automobile-5330343_1280.jpg"
            alt="car 7"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid mx-auto d-block"
            src="https://images.pexels.com/photos/1082655/pexels-photo-1082655.jpeg"
            alt="car 8"
          />
        </div>
        <div class="col-md-4">
          <img
            class="img-fluid rounded-circle"
            src="https://images.pexels.com/photos/210143/pexels-photo-210143.jpeg"
            alt="car 9"
          />
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
