<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form 2 </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header text-center bg-primary text-white">
      <h4>User Form</h4>
    </div>

    <div class="card-body">
      <form>
        <div class="row mb-3">
          <label class="col-sm-4 col-form-label bg-warning">Full Name</label>
          <div class="col-sm-8">
            <input type="text" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-4 col-form-label bg-info">Email</label>
          <div class="col-sm-8">
            <input type="email" class="form-control" readonly value="sarvaiyaparthrajsinh1818@gmail.com">
          </div>
        </div>

        <div class="row mb-3 ">
          <label class="col-sm-4 col-form-label bg-secondary">Mobile</label>
          <div class="col-sm-8">
            <input type="tel" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label ">Upload File</label>
          <input type="file" class="form-control">
        </div>

        <div class="form-check mb-3 bg-primary">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">I accept terms & conditions</label>
        </div>

        <div class="text-center">
          <button class="btn btn-success px-4">Submitted</button>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
