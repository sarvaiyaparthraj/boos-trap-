
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Advanced Badges</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .badge-glow {
            box-shadow: 0 0 8px rgba(0, 0, 0, .3);
        }

        .badge-gradient {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
        }

        .badge-outline {
            border: 2px solid currentColor;
            background-color: transparent;
        }

        .message-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <h2 class="text-center mb-4">Badges 2</h2>

        <div class="row">
            <div class="col-md-6">

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-primary badge-glow">99+</span>
                </div>

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-secondary">99</span>
                </div>

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-warning text-dark">99</span>
                </div>

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-info text-dark">99</span>
                </div>

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-danger">99</span>
                </div>

                <div class="message-item">
                    messages
                    <span class="badge rounded-pill bg-success">99</span>
                </div>

            </div>

            <div>
           

    </div>
</body>

</html>
